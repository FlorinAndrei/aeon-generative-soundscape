<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aeon — a generative ambient soundscape</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <aside id="panel" aria-label="controls"></aside>

  <div id="hint">press <kbd>H</kbd> to hide controls</div>

  <div id="overlay">
    <div class="overlay-inner">
      <h1>Aeon</h1>
      <p>a generative ambient soundscape — synthesized live, evolving on its own.<br />
         nudge it, but you'll never quite hold it still.</p>
      <button class="begin">tap to begin</button>
      <small>headphones recommended · press H to hide the controls</small>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
